[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lite-derivative-gp"
version = "0.9.0"
description = "LITE derivative Gaussian processes with two directions per gradient."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "numpy>=1.23",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
"lite.methods" = ["LICENSE", "NOTICE.md"]

[project.optional-dependencies]
lassodna = ["celer>=0.7.4,<0.8", "scipy>=1.10", "scikit-learn>=1.3"]
md22 = ["gpytorch>=1.12", "linear-operator>=0.5", "omegaconf>=2.3", "scikit-learn>=1.3", "scipy>=1.10", "tqdm>=4.66"]
bo = [
  "scipy>=1.10",
  "botorch>=0.11.3",
  "gpytorch>=1.12",
  "linear-operator>=0.5",
  "pyro-ppl>=1.9",
]

[project.scripts]
run-gp-sim-subprocess = "lite.experiments.gp_sim.subprocess_cli:main"
run-bo = "lite.experiments.bo.runner:main"
plot-bo = "lite.experiments.bo.plot_cli:main"
run-md22 = "lite.experiments.md22.runner:main"
plot-md22 = "lite.experiments.md22.plot_cli:main"
run-md22-lite-ablation = "lite.experiments.md22.ablation:main"
run-direction-ablation = "lite.experiments.directions.runner:main"
run-bo-sweep = "lite.experiments.bo.sweep:main"
plot-direction-ablation = "lite.experiments.directions.plotting:main"
run-symmetry-experiment = "lite.experiments.symmetry.runner:main"
plot-symmetry-experiment = "lite.experiments.symmetry.plotting:main"
plot-md22-lite-ablation = "lite.experiments.md22.plot_ablation:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
