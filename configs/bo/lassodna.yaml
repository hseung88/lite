experiment_name: lite_bo_lassodna
benchmarks: [lassodna]
methods: [lite, tera_batched, vbo, turbo, turbo-logei]
seeds: [1, 27, 42]
budget: 150
n_init: 30
batch_size: 1
device: cuda
dtype: float64
kernel: matern52
use_ard: true

lassodna_data_path: null
lassodna_data_home: data/lassodna
lassodna_split_seed: 42
lassodna_n_splits: 5
lassodna_test_size: 0.15
lassodna_tol: 1.0e-8
lassodna_max_iter: 1000
lassodna_backend: celer
lassodna_torch_max_iter: 20000

vbo_kernel: rbf
vbo_use_outputscale: false
vbo_use_priors: true
vbo_lengthscale_prior_loc: 1.4
vbo_lengthscale_prior_scale: 1.73205
vbo_noise_prior_loc: -4.0
vbo_noise_prior_scale: 1.0
vbo_lengthscale_init: gpytorch_default
vbo_lengthscale_constraint: 1.0e-4
vbo_noise_constraint: 1.0e-4
vbo_initialize_noise: false
vbo_fit_backend: botorch_mll
vbo_fit_maxiter: null
vbo_acq: log_nei
vbo_acq_raw_samples: 512
vbo_acq_restarts: 4
vbo_acq_maxiter: 300
vbo_acq_batch_limit: 64
vbo_acq_sample_around_best: true
vbo_acq_sample_around_best_sigma: 0.1
vbo_acq_retry_on_optimization_warning: false
vbo_nei_mc_samples: 512
vbo_nei_prune_baseline: true
vbo_nei_cache_root: true

turbo_length_init: 0.8
turbo_length_min: 0.0078125
turbo_length_max: 1.6
turbo_success_tolerance: 3
turbo_failure_tolerance: 0
turbo_gp_train_steps: 50
turbo_gp_lr: 0.1
turbo_max_local_points: 2048
turbo_max_cholesky_size: 2000
turbo_noise_min: 0.0005
turbo_noise_max: 0.2
turbo_lengthscale_min: 0.005
turbo_lengthscale_max: 2.0
turbo_outputscale_min: 0.05
turbo_outputscale_max: 20.0
acq_raw_samples: 512
acq_restarts: 4
acq_maxiter: 300

lite_m: 20
lite_initial_train_steps: 50
lite_update_train_steps: 10
lite_refit_every: 20
lite_train_batch_size: 256
lite_prediction_batch_size: 256
lite_lr: 0.01
lite_learn_outputscale: true
lite_learn_lengthscale: true
lite_lengthscale_init: base
lite_base_lengthscale: 1.0
lite_lengthscale_min: 0.003
lite_lengthscale_max: 8.0
lite_learn_sigma_f: true
lite_learn_sigma_g: true
lite_sigma_f: 0.001
lite_sigma_g: 0.001
lite_gradient_noise_model: scaled
lite_acq_raw_samples: 256
lite_acq_restarts: 4
lite_acq_maxiter: 30

tera_m: 20
tera_initial_train_steps: 50
tera_update_train_steps: 10
tera_refit_every: 20
tera_train_batch_size: 256
tera_prediction_batch_size: 256
tera_lr: 0.01
tera_learn_outputscale: true
tera_learn_lengthscale: true
tera_lengthscale_init: base
tera_base_lengthscale: 1.0
tera_lengthscale_min: 0.003
tera_lengthscale_max: 8.0
tera_learn_sigma_f: true
tera_learn_sigma_g: true
tera_sigma_f: 0.001
tera_sigma_g: 0.001
tera_gradient_noise_model: scaled
tera_acq_raw_samples: 256
tera_acq_restarts: 4
tera_acq_maxiter: 30

