experiment_name: md22_cost_accuracy
data_dir: data/md22
datasets: [buckyball-catcher]
methods: [vecchia, tera_batched, lite]
seeds: [7, 23, 42, 71, 99]
train_frac: 0.9
test_frac: 0.1
device: cuda
dtype: float64
kernel: rbf
use_ard: false
lengthscale: 1.0
outputscale: 1.0
x_scale: 3.0
sigma_f: 0.001
sigma_g: 0.001
observation_noise_fraction: 0.0
energy_noise_fraction: null
force_noise_fraction: null
observation_noise_seed: null
initialize_noise_from_observations: true
m: 30
vecchia_train_epochs: 1
vecchia_train_steps: 0
vecchia_train_batch_size: 32
vecchia_prediction_batch_size: 32
vecchia_lr: 0.01
vecchia_learn_sigma_f: true
lite_train_epochs: 1
lite_train_steps: 0
lite_train_batch_size: 32
lite_prediction_batch_size: 32
lite_lr: 0.01
lite_learn_sigma_f: true
lite_learn_sigma_g: true
lite_gradient_noise_model: iid
tera_train_epochs: 1
tera_train_steps: 0
tera_train_batch_size: 32
tera_prediction_batch_size: 32
tera_lr: 0.01
tera_learn_sigma_f: true
tera_learn_sigma_g: true
tera_gradient_noise_model: iid
verbose: true
